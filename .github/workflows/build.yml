name: build-apk

on:
  push:
    branches:
      - arena/b5620ef9-rpg
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image already ships an Android SDK; no extra setup action.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Show toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-output.txt

      - name: Capture compiler errors
        if: failure()
        run: |
          { grep -E "^(e|w): |error:|FAILURE|What went wrong" -A3 build-output.txt || true; } > errors.txt
          cat errors.txt
          echo "--- uploading as artifact ---"

      # Artifacts/logs aren't reachable from the agent sandbox, so on failure we
      # commit the compiler diagnostics back to the branch where they can be read.
      - name: Commit diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "# build diagnostics"; echo; echo '```'; tail -c 12000 build-output.txt; echo '```'; } > ci-errors.md
          git config user.name "ci-diagnostics"
          git config user.email "ci@localhost"
          git add -f ci-errors.md build-output.txt || true
          git commit -m "ci: build diagnostics [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: djb-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"
          TAG="djb-ai-debug"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --target "${GITHUB_SHA}" \
              --title "djb ai — debug APK" \
              --notes "Debug build from ${GITHUB_SHA} (${GITHUB_REF_NAME}). Sideload only; not a production signed release." \
              --prerelease
          fi
